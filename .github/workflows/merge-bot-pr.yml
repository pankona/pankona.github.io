name: Enable auto-merge for Dependabot PRs
on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
      # マージの判断とタイミングは GitHub の auto merge に任せる (required checks は ruleset 側)。
      # ruleset に「Require a pull request before merging」が無いと enablePullRequestAutoMerge が失敗する (GH-491)
      - name: Enable auto-merge
        # major は人間が見る。github-actions の major は workflow の書き換えが伴うことが多い
        if: ${{ steps.metadata.outputs.update-type != 'version-update:semver-major' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}

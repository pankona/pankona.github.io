name: CI for Go tools

on:
  push:
    branches:
      - main
    paths:
      - 'tool/**'
  # required checks に入れられるよう、PR では paths で絞らず常に走らせる (GH-491)
  pull_request:

jobs:
  ci-articlegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'tool/go.mod'
          cache-dependency-path: 'tool/go.sum'
      - name: Build
        run: go build -C ./tool/articlegen -v
  ci-makepr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'tool/go.mod'
          cache-dependency-path: 'tool/go.sum'
      - name: Build
        run: go build -C ./tool/makepr -v
  ci-sincelastcommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'tool/go.mod'
          cache-dependency-path: 'tool/go.sum'
      - name: Build
        run: go build -C ./tool/sincelastcommit -v
